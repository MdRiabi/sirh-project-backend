name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 03:00 UTC : capte les nouvelles CVE/règles CodeQL sur du code
    # qui n'a pas bougé depuis le dernier scan déclenché par push/PR.
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyse CodeQL (Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialisation CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      # Autobuild suffit pour un module Maven standard (pas de génération de
      # code custom ni de multi-module complexe à ce jour).
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Non-bloquant par construction (cf. SECURITE.md) : ce job n'est requis
      # par aucun `needs:` d'un autre workflow, les résultats alimentent
      # uniquement l'onglet Security > Code scanning.
      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
