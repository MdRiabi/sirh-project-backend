name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & tests (unit + intégration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn verify déclenche surefire (tests unitaires) puis failsafe (tests
      # d'intégration Testcontainers) -- le runner ubuntu-latest embarque
      # Docker nativement, requis par Testcontainers pour Postgres/Redis.
      - name: mvn clean verify
        run: mvn -B clean verify

  docker-build:
    name: Build de l'image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de l'image (validation uniquement, aucun push)
        run: docker build -t sirh-backend:ci .

      # Bloquant sur CRITICAL/HIGH (cf. SECURITE.md) : contrairement à
      # CodeQL, une CVE connue sur l'image de base a un correctif direct
      # (bump de tag), donc bloquer est actionnable immédiatement.
      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sirh-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload des résultats Trivy vers Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
