# Dictionnaire i18n des messages d'erreur — clé = ErrorCode.name(), résolu par
# GlobalExceptionHandler via MessageSource. Les entrées portant un ou
# plusieurs {n} sont passées par java.text.MessageFormat (Spring
# AbstractMessageSource) : toute apostrophe littérale doit alors être doublée
# ('') pour ne pas être interprétée comme un caractère d'échappement. Les
# entrées sans {n} restent du texte brut (MessageFormat n'est pas invoqué),
# une apostrophe simple y est donc correcte.

# --- 404 NOT_FOUND ---
ASYNC_JOB_NOT_FOUND=Job asynchrone introuvable : {0}
AUTORISATION_NOT_FOUND=Autorisation introuvable : {0}
DEMANDE_DEVERROUILLAGE_NOT_FOUND=Demande de déverrouillage introuvable : {0}
DEPARTEMENT_NOT_FOUND=Département introuvable : {0}
EMPLOYE_NOT_FOUND=Employé introuvable : {0}
EMPLOYE_NOT_FOUND_BY_BADGE=Aucun employé pour le badgeId {0}
EVALUATION_NOT_FOUND=Évaluation introuvable : {0}
FICHIER_NOT_FOUND=Fichier introuvable : {0}
FICHIER_INDISPONIBLE=Fichier pas encore disponible (statut actuel : {0}). Confirmez l''upload avant de le télécharger.
INDISPONIBILITE_NOT_FOUND=Indisponibilité introuvable : {0}
JOUR_FERIE_NOT_FOUND=Jour férié introuvable : {0}
NOTIFICATION_NOT_FOUND=Notification introuvable : {0}
OUTILLAGE_NOT_FOUND=Outil introuvable : {0}
PARAMETRE_NOT_FOUND=Paramètre global introuvable : {0}
POINTAGE_NOT_FOUND=Pointage introuvable : {0}
POINTEUSE_NOT_FOUND=Pointeuse introuvable : {0}
POINTEUSE_NOT_FOUND_BY_IP=Pointeuse introuvable pour l''IP {0}
SHIFT_NOT_FOUND=Shift introuvable : {0}
TACHE_RENOUVELLEMENT_NOT_FOUND=Tâche de renouvellement introuvable : {0}
UTILISATEUR_NOT_FOUND=Utilisateur introuvable : {0}

# --- 409 CONFLICT ---
CLOTURE_TAUX_ANOMALIES_INSUFFISANT=Taux d''anomalies justifiées insuffisant ({0}% < {1}% requis).
CLOTURE_DEMANDES_EN_ATTENTE=Des demandes (autorisations/indisponibilités) sont encore EN_ATTENTE_RH sur ce mois.
MOIS_DEJA_CLOTURE=Le mois {0} est clôturé (lecture seule). Utilisez /assiduite/demandes-deverrouillage pour un déverrouillage exceptionnel.
DEMANDE_DEVERROUILLAGE_STATUT_INVALIDE=Seule une demande EN_ATTENTE peut être traitée (statut actuel : {0}).
DELAI_REGULARISATION_DEPASSE=[DÉLAI DÉPASSÉ] Les régularisations doivent être effectuées sous 72h. Seul le RH peut outrepasser ce délai.
QUOTA_AUTORISATION_DEPASSE=[QUOTA DÉPASSÉ : +{0}min] Précisez le traitement des heures excédentaires (traitementDepassement : DEDUCTION_SALAIRE ou RECUPERATION) pour valider.
AUTORISATION_VALIDATION_STATUT_INVALIDE=Seule une autorisation EN_ATTENTE_RH peut être validée (statut actuel : {0}).
AUTORISATION_REFUS_STATUT_INVALIDE=Seule une autorisation EN_ATTENTE_RH peut être refusée (statut actuel : {0}).
INDISPONIBILITE_VALIDATION_STATUT_INVALIDE=Seule une indisponibilité EN_ATTENTE_RH peut être validée (statut actuel : {0}).
INDISPONIBILITE_REFUS_STATUT_INVALIDE=Seule une indisponibilité EN_ATTENTE_RH peut être refusée (statut actuel : {0}).
SOLDE_INSUFFISANT=Solde insuffisant ({0} jours disponibles)
EVALUATION_DEJA_EXISTANTE=Une évaluation existe déjà pour cet employé sur l''année {0}.
EVALUATION_DEJA_VALIDEE=Grille déjà validée par le RH, elle ne peut plus être modifiée (référence {0}).
EVALUATION_VALIDATION_STATUT_INVALIDE=Seule une évaluation EN_COURS peut être validée (référence {0}).
OUTILLAGE_DEJA_ATTRIBUE=Outil déjà attribué : une restitution (check-in) est requise avant tout nouveau rattachement.
OUTILLAGE_NON_ATTRIBUE=Outil non attribué : aucune restitution à effectuer.
PLANNING_CHEVAUCHEMENT_DIRECT=Affectation refusée : l''employé a déjà une affectation sur cette période.
PLANNING_REPOS_LEGAL_INSUFFISANT=[VIOLATION LÉGALE] Repos consécutif insuffisant ({0}h au lieu de {1}h minimum). Affectation refusée.
PLANNING_CONGE_VALIDE_CHEVAUCHEMENT=Affectation refusée : l''employé a un congé validé sur cette période. Veuillez sélectionner un remplaçant.
TACHE_RENOUVELLEMENT_STATUT_INVALIDE=Seule une tâche EN_COURS ou URGENT_EXPIRE peut être traitée (statut actuel : {0}).
REPORT_NOT_READY=Le rapport {0} n''est pas encore prêt au téléchargement.
DATA_INTEGRITY_VIOLATION=Valeur en conflit avec une contrainte d'unicité existante (matricule, email, nom, date ou identifiant déjà utilisé).

# --- 400 BAD_REQUEST ---
MOIS_NON_CLOTURE=Ce mois n'est pas clôturé — aucun déverrouillage à demander.
EVALUATION_INCOMPLETE=Compétence(s) obligatoire(s) non notée(s) : {0}
IMPORT_ENTETE_MANQUANTE=Le fichier ne contient pas de ligne d''en-tête.
IMPORT_COLONNE_MANQUANTE=Colonne obligatoire manquante : {1} (colonnes attendues : badgeId, dateTime, typeEvenement, methodeValidation [optionnelle]).
IMPORT_BADGE_ID_MANQUANT=badgeId manquant.
IMPORT_MATRICULE_INEXISTANT=Matricule ''{1}'' inexistant.
IMPORT_VALEUR_INVALIDE=Valeur invalide pour {1} : ''{2}''.
IMPORT_DATE_HEURE_MANQUANTE=Date/heure manquante.
IMPORT_DATE_HEURE_INVALIDE=Date/heure invalide : ''{1}'' (format attendu : yyyy-MM-dd HH:mm).
IMPORT_FICHIER_TROP_VOLUMINEUX=Fichier trop volumineux : {0} lignes (maximum {1}).

# --- 401 UNAUTHORIZED ---
IDENTIFIANTS_INVALIDES=Identifiants invalides.
REFRESH_TOKEN_INVALIDE=Refresh token invalide ou expiré.
REFRESH_TOKEN_REVOQUE=Refresh token révoqué.
TOKEN_UTILISATEUR_INTROUVABLE=Utilisateur introuvable.
COMPTE_DESACTIVE=Compte désactivé.
CHANGEMENT_MDP_UTILISATEUR_INTROUVABLE=Utilisateur introuvable.
MOT_DE_PASSE_ACTUEL_INCORRECT=Mot de passe actuel incorrect.

# --- 423 LOCKED ---
COMPTE_VERROUILLE=Compte verrouillé jusqu''à {0} suite à 5 échecs de connexion consécutifs.

# --- 401 / 403 (filtres Spring Security) ---
NON_AUTHENTIFIE=Authentification requise ou token invalide/expiré.
ACCES_REFUSE=Accès refusé : rôle insuffisant pour cette action.

# --- 500 INTERNAL_SERVER_ERROR ---
SYSTEM_ERROR=Une erreur technique est survenue. Veuillez réessayer ultérieurement ou contacter le support si le problème persiste.
