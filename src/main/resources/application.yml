spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sirh}
    username: ${SPRING_DATASOURCE_USERNAME:sirh}
    password: ${SPRING_DATASOURCE_PASSWORD:sirh}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/masterchangelog.xml
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  refresh-secret: ${JWT_REFRESH_SECRET:change-me-too-in-production}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

storage:
  path: ${STORAGE_PATH:./storage}

management:
  endpoints:
    web:
      exposure:
        include: health
