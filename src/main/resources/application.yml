spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sirh}
    username: ${SPRING_DATASOURCE_USERNAME:sirh}
    password: ${SPRING_DATASOURCE_PASSWORD:sirh}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/masterchangelog.xml
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  refresh-secret: ${JWT_REFRESH_SECRET:change-me-too-in-production}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

storage:
  path: ${STORAGE_PATH:./storage}
  buckets:
    documents-rh: ${STORAGE_S3_BUCKET_DOCUMENTS_RH:sirh-documents-rh}
    uploads: ${STORAGE_S3_BUCKET_UPLOADS:sirh-uploads}

# Client du service technique s3-file-system (repo séparé), consommé via
# FileStorageClient (Feign) — cf. docs/LOTS/LOT_12_FICHIERS_CLOUD.md.
filestorage:
  api:
    url: ${FILESTORAGE_API_URL:http://localhost:8081}
    key: ${FILESTORAGE_API_KEY:change-me-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health
